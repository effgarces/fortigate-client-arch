# FortiGate compatibility settings of the patched strongSwan.
# Start with only the first one; enable the rest one at a time, only if the
# gateway rejects you.
charon {
    # How the final AUTH (after the token) is keyed. The log line
    # "FortiGate: AUTH keyed from ..." shows what is in effect.
    #   skp -> SK_pi, msk -> EAP MSCHAPv2 key, psk -> the IKE pre-shared key
    # Removing the line gives stock behaviour (msk). If the final AUTH is
    # rejected, try msk, then psk.
    fortigate_auth_key = skp

    # Mimic FortiClient more closely (all off by default):
    # fortigate_suppress_eap_only = yes
    # fortigate_send_forticlient_vid = yes
    # fortigate_fct_file = /etc/strongswan.d/fct_data.txt
}
