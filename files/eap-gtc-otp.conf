# Token step of the patched strongSwan eap-gtc plugin: ask the helper.
charon {
    plugins {
        eap-gtc {
            otp_helper = /usr/local/sbin/fortigate-otp-helper.sh
            # always: every GTC round is the token (the password was already
            # sent in the EAP-MSCHAPv2 step)
            otp_mode = always
        }
    }
}
