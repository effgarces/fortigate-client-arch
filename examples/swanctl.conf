# Example /etc/swanctl/conf.d/fortigate.conf  (copy, edit, chmod 600)
# Every value in CAPITALS or marked CHANGE_ME is yours to fill in.
connections {
  fortigate {
    version = 2
    remote_addrs = VPN.EXAMPLE.COM
    vips = 0.0.0.0              # ask the gateway for a virtual IP
    mobike = no
    fragmentation = no
    dpd_delay = 30s
    reauth_time = 0
    # must match what your gateway/FortiClient profile uses (look at the
    # IKE_SA_INIT exchange in the log: "selected proposal: ...")
    proposals = aes256gcm16-prfsha256-ecp256, aes256-sha256-ecp256

    local {
      auth = eap-mschapv2       # EAP only: do NOT add a client-side PSK here
      eap_id = YOUR_USERNAME
      # id = YOUR-FORTICLIENT-LOCAL-ID   # only if your FortiClient profile has a "Local ID"
    }
    remote {
      auth = psk                # the pre-shared key authenticates the GATEWAY
    }
    children {
      fortigate {
        # split tunnel: the networks FortiClient routes through the VPN
        # (Windows: run "route print" while connected, take the routes via the VPN adapter)
        remote_ts = 10.0.0.0/8, 192.0.2.10/32
        esp_proposals = aes256gcm16-ecp256, aes256-sha256-ecp256
        life_time = 12h
        replay_window = 32
      }
    }
  }
}

secrets {
  # The section name must START with "ike" / "eap": that is what sets the secret's type.
  ike-fortigate {
    secret = "CHANGE_ME_GATEWAY_PSK"
  }
  eap-fortigate {
    id = YOUR_USERNAME          # must equal eap_id above
    secret = "CHANGE_ME_PASSWORD"
  }
}
